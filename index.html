
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ভালুকা সুপার অ্যাপস - Bhaluka Super Apps</title>
<meta name="theme-color" content="#00b44a">
<link rel="manifest" href="data:application/json,[STRIPPED]
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Hind Siliguri',Arial,sans-serif;background:#f0f2f5}
.header{background:#00b44a;color:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{margin:0;font-size:22px}
.header p{margin:3px 0 0;font-size:13px;opacity:.9}
#netStatus{text-align:center;padding:8px;font-size:13px;font-weight:bold;display:none}
.top-btns{display:flex;gap:8px;padding:10px}
.top-btns button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:15px}
.btn-post{background:#00b44a;color:#fff}.btn-dash{background:#fff;border:1px solid #ddd!important}
.card{background:#fff;margin:10px;border-radius:12px;padding:12px;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.post-img{width:100%;border-radius:10px;max-height:320px;object-fit:cover}
.post-title{font-size:17px;font-weight:bold;margin:8px 0 4px}
.post-desc{font-size:14px;color:#444;line-height:1.5}
.post-time{font-size:12px;color:#888;margin-top:6px}
#dashboard{display:none}
.dash-box{background:linear-gradient(135deg,#00b44a,#00d65e);color:#fff;padding:18px;border-radius:12px;text-align:center}
.dash-box h2{margin:0}.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.dash-item{background:#fff;padding:15px;border-radius:12px;text-align:center}
.dash-item b{font-size:20px;display:block}
input,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
#adminBox{display:none}
</style>
</head>
<body>
<div class="header">
<h1>🌾 ভালুকা সুপার অ্যাপস</h1>
<p>Bhaluka Super Apps • ভালুকা, ময়মনসিংহ</p>
</div>
<div id="netStatus"></div>

<div class="top-btns">
<button class="btn-post" onclick="showHome()">🏠 হোম</button>
<button class="btn-dash" onclick="showDashboard()">📊 ড্যাশবোর্ড</button>
</div>

<div id="home">
<div class="card" id="adminBox">
<h3>✍️ নতুন পোস্ট</h3>
<input id="pTitle" placeholder="পোস্টের টাইটেল">
<textarea id="pDesc" placeholder="বিস্তারিত লিখুন..."></textarea>
<input id="pImg" placeholder="ছবির লিংক (ঐচ্ছিক)">
<button class="btn-post" style="width:100%;padding:12px;border:none;border-radius:10px" onclick="savePost()">পোস্ট করুন</button>
</div>
<div id="postList"></div>
</div>

<div id="dashboard">
<div class="card">
<div class="dash-box">
<h2>📊 ড্যাশবোর্ড</h2>
<p id="dashSub">ভালুকা সুপার অ্যাপস</p>
</div>
<div class="dash-grid">
<div class="dash-item">👥<b id="dUsers">0</b>মোট ইউজার</div>
<div class="dash-item">📝<b id="dPosts">0</b>মোট পোস্ট</div>
<div class="dash-item">👁️<b id="dViews">0</b>মোট ভিউ</div>
<div class="dash-item">📶<b id="dNet">Online</b>নেট স্ট্যাটাস</div>
</div>
<div class="card" style="margin:10px 0 0">
<h3>📋 লাস্ট পোস্ট (Offline ও দেখা যাবে)</h3>
<div id="dashPosts"></div>
<button onclick="clearCache()" style="width:100%;padding:10px;margin-top:10px;border:1px solid #ddd;background:#fff;border-radius:10px">🗑️ Cache মুছুন</button>
</div>
</div>
</div>

<script>
// ===== আগের সব কোড Same আছে =====
let posts = [];
let views = parseInt(localStorage.getItem('bhaluka_views')||'0');
views++; localStorage.setItem('bhaluka_views', views);

// ===== OFFLINE SYSTEM - Net ছাড়াও Desh Board আসবে =====
// 1. আগের পোস্ট ফোনে সেভ করে রাখা
function loadFromCache(){
  try{
    let saved = localStorage.getItem('bhaluka_posts');
    if(saved){ posts = JSON.parse(saved); }
    // ডেমো পোস্ট - যদি একদম খালি থাকে
    if(posts.length===0){
      posts = [
        {title:'🌾 ভালুকায় স্বাগতম!', desc:'ভালুকা সুপার অ্যাপসে আপনাকে স্বাগতম। এখানে ভালুকার সব খবর, বাজার দর, চাকরি পাবেন।', img:'https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=800', time:'এখনই'},
        {title:'🛒 ভালুকা বাজার দর', desc:'আজকের বাজার: চাল - ৬৫ টাকা, ডাল - ১২০ টাকা, তেল - ১৮০ টাকা। প্রতিদিন আপডেট পেতে অ্যাপটি খুলুন।', img:'https://images.unsplash.com/photo-1542838132-92c53300491e?w=800', time:'আজ সকাল'},
        {title:'💼 ভালুকায় চাকরি', desc:'ভালুকা ইপিজেডে নতুন নিয়োগ চলছে। বিস্তারিত জানতে ড্যাশবোর্ড দেখুন।', img:'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=800', time:'গতকাল'}
      ];
      localStorage.setItem('bhaluka_posts', JSON.stringify(posts));
    }
  }catch(e){ posts=[]; }
}
function saveToCache(){ localStorage.setItem('bhaluka_posts', JSON.stringify(posts)); }

function renderPosts(){
  let html='';
  posts.forEach(p=>{
    html += `<div class="card"><img class="post-img" src="${p.img||'https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=800'}"><div class="post-title">${p.title}</div><div class="post-desc">${p.desc}</div><div class="post-time">🕒 ${p.time||''} • ভালুকা</div></div>`;
  });
  document.getElementById('postList').innerHTML = html || '<div class="card">কোনো পোস্ট নাই</div>';
  // Dashboard আপডেট - Offline ও চলবে
  document.getElementById('dPosts').innerText = posts.length;
  document.getElementById('dViews').innerText = views;
  document.getElementById('dUsers').innerText = 120 + posts.length*3;
  let dHtml='';
  posts.slice(0,5).forEach(p=>{ dHtml+=`<div style="padding:8px;border-bottom:1px solid #eee">📌 <b>${p.title}</b><br><small>${p.desc.substring(0,60)}...</small></div>`; });
  document.getElementById('dashPosts').innerHTML = dHtml;
}

function savePost(){
  let t=document.getElementById('pTitle').value.trim();
  let d=document.getElementById('pDesc').value.trim();
  let im=document.getElementById('pImg').value.trim();
  if(!t||!d){ alert('টাইটেল আর বিস্তারিত লিখুন!'); return; }
  posts.unshift({title:t, desc:d, img:im, time:'এখনই'});
  saveToCache(); renderPosts();
  document.getElementById('pTitle').value=''; document.getElementById('pDesc').value=''; document.getElementById('pImg').value='';
  alert('✅ পোস্ট হয়ে গেছে! Offline ও থাকবে!');
}

function showHome(){ document.getElementById('home').style.display='block'; document.getElementById('dashboard').style.display='none'; }
function showDashboard(){ document.getElementById('home').style.display='none'; document.getElementById('dashboard').style.display='block'; renderPosts(); }
function clearCache(){ if(confirm('Cache মুছবেন?')){ localStorage.removeItem('bhaluka_posts'); location.reload(); } }

// Net চেক - Net না থাকলেও Desh Board চলবে
function updateNet(){
  let st=document.getElementById('netStatus');
  let isOnline=navigator.onLine;
  document.getElementById('dNet').innerText = isOnline?'Online':'Offline';
  if(!isOnline){
    st.style.display='block'; st.style.background='#fff3cd'; st.style.color='#856404';
    st.innerHTML='⚠️ Net নাই - কিন্তু Desh Board Offline থেকে চলছে! ✅';
  }else{
    st.style.display='block'; st.style.background='#d4edda'; st.style.color='#155724';
    st.innerHTML='✅ Net আছে - সব আপডেট পাবেন!';
    setTimeout(()=>{st.style.display='none'},3000);
  }
}
window.addEventListener('online', ()=>{ updateNet(); renderPosts(); });
window.addEventListener('offline', updateNet);

// Admin - ?admin=1 দিলে পোস্ট বক্স আসবে
if(location.search.includes('admin=1')){ document.getElementById('adminBox').style.display='block'; }

// START - প্রথমে Cache থেকে লোড, তারপর Render
loadFromCache();
renderPosts();
updateNet();
</script>
</body>
</html>
